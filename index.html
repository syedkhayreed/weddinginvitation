<!DOCTYPE html>
<!--
  ================================================================
  GROOM & BRIDE'S WEDDING QUEST — an 8-bit GBA-style invitation
  ================================================================
  HOW TO CUSTOMIZE:
    Scroll down to the "CONFIG" block near the top of the <script>
    tag. Edit the names, date, venue, and (optionally) form endpoints
    there. Nothing else needs to change to get this working.

  HOW TO DEPLOY ON GITHUB PAGES:
    1. Create a new GitHub repo (public).
    2. Add this file to the repo root and name it index.html.
    3. Commit + push.
    4. Repo Settings -> Pages -> Source: "Deploy from branch",
       Branch: main, folder: / (root). Save.
    5. Wait ~1 minute, then your link will be:
       https://<your-username>.github.io/<repo-name>/
    6. Share that link with guests.

  NOTE ON RSVP / WISHES:
    GitHub Pages is a static host (no server/database). This file
    saves RSVPs and wishes in the guest's own browser (localStorage)
    so you can fully test it end-to-end right now. To actually
    collect responses from real guests, set CONFIG.rsvpEndpoint /
    CONFIG.wishEndpoint to a free form backend like Formspree
    (https://formspree.io) — one line change, no code rewrite needed.
  ================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4a3d78">
<title>Groom &amp; Bride — Wedding Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --shell:#8577c2; --shell-dark:#4a3d78; --shell-darker:#332a56;
    --screen-border:#1b1b26;
    --grass:#7ec850; --grass-d:#5aa838;
    --water:#4f9bdc; --water-d:#2f6fb0;
    --hole:#241608; --hole-rim:#4a3018;
    --bush:#2f7a3a; --bush-d:#1f5a28;
    --gold:#f6d33c; --gold-d:#c79a10;
    --paper:#fbf3da; --ink:#2a2434; --accent:#e8517a;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; }
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 15%,#3d3a63,#12111c 70%);
    font-family:'VT323',monospace; color:var(--ink);
    padding:14px;
  }
  .pixel{ font-family:'Press Start 2P',monospace; }
  #gba{
    width:min(430px,94vw);
    background:linear-gradient(155deg,var(--shell),var(--shell-dark) 70%,var(--shell-darker));
    border-radius:22px 22px 54px 54px;
    padding:16px 14px 24px;
    box-shadow:0 10px 0 var(--shell-darker),0 18px 34px rgba(0,0,0,.55);
    position:relative;
    user-select:none;
  }
  #brand{
    text-align:center; color:#e8e4ff; font-size:10px; letter-spacing:2px;
    margin-bottom:8px; opacity:.85;
  }
  #screenWrap{
    background:var(--screen-border); border-radius:10px; padding:9px;
    box-shadow:inset 0 0 0 3px #000,inset 0 0 22px rgba(0,0,0,.7);
  }
  #screen{
    position:relative; width:100%; aspect-ratio:420/364;
    background:#0d1b0d; overflow:hidden; border-radius:4px;
  }
  #screen canvas{ width:100%; height:100%; image-rendering:pixelated; display:block; }
  .panel{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:linear-gradient(180deg,#274b1e,#0d1b0d 85%);
    color:var(--paper); padding:16px;
  }
  #titleScreen .logo{
    font-size:22px; line-height:1.5; color:var(--gold);
    text-shadow:2px 2px 0 #6b4a00; margin-bottom:6px;
  }
  #titleScreen .subtitle{ font-size:11px; letter-spacing:2px; margin-bottom:26px; color:#cfe8c0;}
  #titleScreen .blink{ font-size:12px; animation:blink 1s steps(1) infinite; color:#fff; }
  @keyframes blink{ 50%{ opacity:0; } }
  #selectScreen .ptitle{ font-size:12px; margin-bottom:22px; color:#fff; letter-spacing:1px; }
  .choices{ display:flex; gap:18px; }
  .charBtn{
    background:#1c3a14; border:3px solid #cfe8c0; border-radius:8px;
    padding:10px 8px; display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer; color:var(--paper); font-family:'Press Start 2P',monospace; font-size:9px;
  }
  .charBtn:active{ transform:translateY(2px); }
  .charBtn canvas{ image-rendering:pixelated; background:#12220c; border-radius:4px; }
  #banner{
    position:absolute; left:6px; right:6px; top:6px; z-index:5;
    background:rgba(10,10,20,.85); color:#fff; border:2px solid var(--gold);
    border-radius:6px; padding:7px 9px; font-size:13px; text-align:center; line-height:1.3;
  }
  #smashBtn{
    position:absolute; left:50%; top:52%; transform:translate(-50%,-50%);
    z-index:6; font-family:'Press Start 2P',monospace; font-size:12px;
    background:var(--gold); color:#4a2e00; border:3px solid #c79a10; border-radius:8px;
    padding:10px 16px; box-shadow:0 4px 0 #8a6a00; cursor:pointer;
    animation:pulse 1s infinite;
  }
  @keyframes pulse{ 0%,100%{ transform:translate(-50%,-50%) scale(1); } 50%{ transform:translate(-50%,-50%) scale(1.08); } }
  #inviteScreen{ background:var(--paper); color:var(--ink); text-align:left; padding:0; overflow:hidden; }
  .tabs{ display:flex; width:100%; }
  .tabBtn{
    flex:1; padding:9px 2px; border:none; background:#d8cba0; color:#5a4a2a;
    font-family:'Press Start 2P',monospace; font-size:8px; cursor:pointer; border-bottom:3px solid #b8a878;
  }
  .tabBtn.active{ background:var(--paper); color:var(--accent); border-bottom:3px solid var(--accent); }
  .tabPanels{ width:100%; flex:1; overflow-y:auto; padding:12px 14px 16px; }
  .tabPanel{ display:none; }
  .tabPanel.active{ display:block; }
  .tabPanel h2{ font-family:'Press Start 2P',monospace; font-size:14px; color:var(--accent); margin:2px 0 10px; line-height:1.5;}
  .tabPanel p{ font-size:16px; margin:4px 0; }
  .infoRow{ font-size:17px; margin:8px 0; }
  .infoRow.small{ font-size:14px; color:#6a5a3a; }
  #countdown{
    margin-top:12px; font-family:'Press Start 2P',monospace; font-size:11px;
    background:#2a2434; color:var(--gold); padding:9px; border-radius:6px; text-align:center;
  }
  #mapLink{
    display:inline-block; margin-top:10px; font-family:'Press Start 2P',monospace; font-size:9px;
    background:var(--accent); color:#fff; padding:8px 10px; border-radius:6px; text-decoration:none;
  }
  form label{ display:block; font-size:15px; margin:10px 0 4px; color:#4a3a1a; }
  form input, form select, form textarea{
    width:100%; font-family:'VT323',monospace; font-size:17px; padding:7px 8px;
    border:2px solid #b8a878; border-radius:5px; background:#fffdf5; color:var(--ink);
  }
  form textarea{ resize:vertical; min-height:52px; }
  form button{
    margin-top:12px; width:100%; font-family:'Press Start 2P',monospace; font-size:10px;
    background:var(--accent); color:#fff; border:none; border-radius:6px; padding:11px; cursor:pointer;
    box-shadow:0 3px 0 #a83358;
  }
  form button:active{ transform:translateY(2px); box-shadow:none; }
  #rsvpStatus,#wishStatus{ margin-top:8px; font-size:15px; color:#1f7a3a; min-height:18px; }
  .wishCard{
    background:#fff; border:2px solid #d8cba0; border-radius:6px; padding:8px 10px; margin-top:8px;
  }
  .wishCard b{ color:var(--accent); }
  .wishCard .when{ font-size:12px; color:#9a8a6a; }
  #controls{ display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding:0 4px; }
  #dpad{ position:relative; width:96px; height:96px; }
  #dpad button{
    position:absolute; width:32px; height:32px; background:#2b2438; color:#cfc8ea;
    border:2px solid #17131f; border-radius:5px; font-size:14px; cursor:pointer;
    touch-action:none;
  }
  #dpad button:active{ background:#443a5c; }
  #dpad button[data-dir="up"]{ left:32px; top:0; }
  #dpad button[data-dir="left"]{ left:0; top:32px; }
  #dpad button[data-dir="right"]{ left:64px; top:32px; }
  #dpad button[data-dir="down"]{ left:32px; top:64px; }
  #abBtns{ display:flex; gap:10px; align-items:center; }
  #abBtns button{
    width:52px; height:52px; border-radius:50%; border:2px solid #17131f;
    font-family:'Press Start 2P',monospace; font-size:13px; cursor:pointer;
  }
  #aBtn{ background:var(--accent); color:#fff; }
  #bBtn{ background:#5a4d8a; color:#fff; margin-top:16px; }
  #startSelect{ display:flex; justify-content:center; gap:10px; margin-top:12px; }
  #startSelect button{
    font-family:'Press Start 2P',monospace; font-size:8px; background:#2b2438; color:#cfc8ea;
    border:2px solid #17131f; border-radius:12px; padding:7px 12px; cursor:pointer;
  }
  #startSelect button:active{ background:#443a5c; }
  a{ color:inherit; }
</style>
</head>
<body>

<div id="gba">
  <div id="brand" class="pixel">GBA &middot; WEDDING EDITION</div>

  <div id="screenWrap">
    <div id="screen">

      <div id="titleScreen" class="panel">
        <div class="logo pixel" id="titleLogo">GROOM<br>&amp;<br>BRIDE</div>
        <div class="subtitle pixel">WEDDING QUEST</div>
        <div class="blink pixel">PRESS START</div>
      </div>

      <div id="selectScreen" class="panel" hidden>
        <div class="ptitle pixel">CHOOSE YOUR SIDE</div>
        <div class="choices">
          <button class="charBtn" data-side="groom">
            <canvas id="portraitGroom" width="56" height="64"></canvas>
            <span id="labelGroom">GROOM SIDE</span>
          </button>
          <button class="charBtn" data-side="bride">
            <canvas id="portraitBride" width="56" height="64"></canvas>
            <span id="labelBride">BRIDE SIDE</span>
          </button>
        </div>
      </div>

      <canvas id="gameCanvas" width="420" height="364" hidden></canvas>
      <div id="banner" hidden></div>
      <button id="smashBtn" class="pixel" hidden>SMASH!</button>

      <div id="inviteScreen" class="panel" hidden style="justify-content:flex-start;">
        <div class="tabs">
          <button class="tabBtn active pixel" data-tab="details">DETAILS</button>
          <button class="tabBtn pixel" data-tab="rsvp">RSVP</button>
          <button class="tabBtn pixel" data-tab="wishes">WISHES</button>
        </div>
        <div class="tabPanels">
          <div class="tabPanel active" id="tab-details">
            <h2 id="coupleTitle">GROOM &amp; BRIDE</h2>
            <p>are getting married &mdash; and you're invited!</p>
            <div class="infoRow" id="rowDate">📅 DATE: —</div>
            <div class="infoRow" id="rowTime">⏰ TIME: —</div>
            <div class="infoRow" id="rowVenue">📍 VENUE: —</div>
            <div class="infoRow small" id="rowAddress"></div>
            <a id="mapLink" class="pixel" target="_blank" rel="noopener">OPEN MAP ➜</a>
            <div id="countdown">CALCULATING...</div>
          </div>
          <div class="tabPanel" id="tab-rsvp">
            <h2>RSVP</h2>
            <form id="rsvpForm">
              <label for="rsvpName">YOUR NAME</label>
              <input id="rsvpName" required maxlength="60">
              <label for="rsvpAttend">ATTENDING?</label>
              <select id="rsvpAttend">
                <option value="yes">YES, COUNT ME IN!</option>
                <option value="no">SORRY, CAN'T MAKE IT</option>
              </select>
              <label for="rsvpGuests">GUESTS (incl. you)</label>
              <input id="rsvpGuests" type="number" min="1" max="10" value="1">
              <label for="rsvpNote">NOTE (optional)</label>
              <textarea id="rsvpNote" maxlength="200"></textarea>
              <button type="submit" class="pixel">SEND RSVP</button>
            </form>
            <div id="rsvpStatus"></div>
          </div>
          <div class="tabPanel" id="tab-wishes">
            <h2>WISHES</h2>
            <form id="wishForm">
              <label for="wishName">YOUR NAME</label>
              <input id="wishName" required maxlength="60">
              <label for="wishMsg">YOUR WISH</label>
              <textarea id="wishMsg" required maxlength="240"></textarea>
              <button type="submit" class="pixel">SEND WISH</button>
            </form>
            <div id="wishStatus"></div>
            <div id="wishList" style="margin-top:10px;"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div id="controls">
    <div id="dpad">
      <button data-dir="up">▲</button>
      <button data-dir="left">◀</button>
      <button data-dir="right">▶</button>
      <button data-dir="down">▼</button>
    </div>
    <div id="abBtns">
      <button id="bBtn" class="pixel">B</button>
      <button id="aBtn" class="pixel">A</button>
    </div>
  </div>
  <div id="startSelect">
    <button id="muteBtn" class="pixel">🔊 START</button>
    <button id="menuBtn" class="pixel">☰ SELECT</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================= CONFIG — EDIT ME ================= */
const CONFIG = {
  groomName: "Groom",
  brideName: "Bride",
  weddingDateDisplay: "Saturday, 12 December 2026",
  weddingDateISO: "2026-12-12T16:00:00",
  weddingTime: "4:00 PM Ceremony • 7:00 PM Reception",
  venueName: "Grand Ballroom, Sunway Resort Hotel",
  venueAddress: "Persiaran Lagoon, Bandar Sunway, 47500 Petaling Jaya, Selangor",
  mapsUrl: "", // leave blank to auto-build from venueAddress
  rsvpEndpoint: "", // e.g. "https://formspree.io/f/xxxxxxxx"
  wishEndpoint: ""  // e.g. "https://formspree.io/f/yyyyyyyy"
};
if(!CONFIG.mapsUrl){
  CONFIG.mapsUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(CONFIG.venueAddress);
}

/* ================= DOM refs ================= */
const titleScreen = document.getElementById('titleScreen');
const selectScreen = document.getElementById('selectScreen');
const gameCanvas = document.getElementById('gameCanvas');
const inviteScreen = document.getElementById('inviteScreen');
const bannerEl = document.getElementById('banner');
const smashBtn = document.getElementById('smashBtn');
const ctx = gameCanvas.getContext('2d');

/* ================= Map ================= */
const TILE = 28, COLS = 15, ROWS = 13;
const MAP_ROWS = [
"BBBBBBBBBBBBBBB",
"B.............B",
"B..WW.....WW..B",
"B..WW.....WW..B",
"B......H......B",
"B...H.....H...B",
"B......P......B",
"B...H.....H...B",
"B......H......B",
"B..WW.....WW..B",
"B..WW.....WW..B",
"B......S......B",
"BBBBBBBBBBBBBBB"
];
function tileAt(col,row){
  if(row<0||row>=ROWS||col<0||col>=COLS) return 'B';
  return MAP_ROWS[row][col];
}
let startPos=null, prizePos=null;
for(let r=0;r<ROWS;r++){
  for(let c=0;c<COLS;c++){
    const t = tileAt(c,r);
    if(t==='S') startPos = {col:c,row:r};
    if(t==='P') prizePos = {col:c,row:r};
  }
}

function buildPatrol(){
  const path=[]; const top=2,bottom=10,left=2,right=12;
  for(let c=left;c<=right;c++) path.push({col:c,row:top});
  for(let r=top+1;r<=bottom;r++) path.push({col:right,row:r});
  for(let c=right-1;c>=left;c--) path.push({col:c,row:bottom});
  for(let r=bottom-1;r>top;r--) path.push({col:left,row:r});
  return path;
}
const PATROL = buildPatrol();

/* ================= Audio ================= */
let audioCtx = null;
let musicOn = true;
let musicTimeout = null;

function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
  }
  if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
}
function beepAt(freq,dur,type,vol,startTime){
  if(!audioCtx || freq<=0) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(vol, startTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(startTime); osc.stop(startTime + dur + 0.02);
}
function beep(freq,dur,type,vol,delay){
  if(!audioCtx) return;
  beepAt(freq,dur,type,vol==null?0.14:vol, audioCtx.currentTime + (delay||0));
}
function sfxStep(){ if(musicOn) beep(500+Math.random()*60, 0.045, 'square', 0.045, 0); }
function sfxBlocked(){ beep(130, 0.12, 'sawtooth', 0.12, 0); }
function sfxSink(){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(500,t0);
  osc.frequency.exponentialRampToValueAtTime(70,t0+0.6);
  gain.gain.setValueAtTime(0.18,t0);
  gain.gain.exponentialRampToValueAtTime(0.0001,t0+0.65);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+0.7);
}
function sfxCaught(){ [440,370,310,220].forEach((f,i)=>beep(f,0.18,'square',0.16,i*0.15)); }
function sfxUnlock(){ [523,659,784,1046].forEach((f,i)=>beep(f,0.14,'square',0.16,i*0.12)); }
function sfxSubmit(){ [660,880,990].forEach((f,i)=>beep(f,0.12,'triangle',0.16,i*0.1)); }

const MELODY = [
  [523,0.2],[659,0.2],[784,0.2],[659,0.2],
  [523,0.2],[0,0.2],[587,0.2],[523,0.2],
  [440,0.4],[0,0.3],
  [523,0.2],[659,0.2],[784,0.2],[880,0.2],
  [784,0.4],[0,0.4]
];
function scheduleMusicLoop(){
  if(!musicOn || !audioCtx) return;
  let t = audioCtx.currentTime + 0.05;
  const start = t;
  MELODY.forEach(([f,d])=>{
    if(f>0) beepAt(f, d*0.85, 'square', 0.05, t);
    t += d;
  });
  musicTimeout = setTimeout(scheduleMusicLoop, (t-start)*1000);
}
function startMusic(){
  ensureAudio();
  if(musicOn && audioCtx && !musicTimeout) scheduleMusicLoop();
}
function toggleMusic(){
  musicOn = !musicOn;
  document.getElementById('muteBtn').textContent = musicOn ? '🔊 START' : '🔈 START';
  if(musicOn){ startMusic(); }
  else { clearTimeout(musicTimeout); musicTimeout=null; }
}

/* ================= Sprites ================= */
const PAL = {
  skin:'#ffcf9c', hairBlack:'#221a1a', hairBrown:'#5c3a21',
  suit:'#1c1c24', shirt:'#ffffff', tie:'#c81e3a',
  dress:'#ff7fac', dressTrim:'#ffffff', shoe:'#33241a',
  dragonBody:'#4a8a3a', dragonBelly:'#dede6a', dragonWing:'#2f6b26',
  gold:'#f6d33c'
};

function drawGroom(c,x,y,frame,flip){
  c.save();
  if(flip){ c.translate(x+24,y); c.scale(-1,1); x=0; y=0; }
  c.fillStyle = PAL.suit;
  if(frame===0){ c.fillRect(x+6,y+22,6,7); c.fillRect(x+14,y+22,6,7); }
  else { c.fillRect(x+5,y+22,6,7); c.fillRect(x+15,y+22,6,7); }
  c.fillStyle = PAL.shoe;
  c.fillRect(x+5,y+27,7,3); c.fillRect(x+13,y+27,7,3);
  c.fillStyle = PAL.suit;
  c.fillRect(x+4,y+11,18,13);
  c.fillStyle = PAL.shirt;
  c.fillRect(x+10,y+11,6,11);
  c.fillStyle = PAL.tie;
  c.fillRect(x+12,y+12,2,9);
  c.fillStyle = PAL.suit;
  c.fillRect(x+1,y+12,4,9); c.fillRect(x+21,y+12,4,9);
  c.fillStyle = PAL.skin;
  c.fillRect(x+6,y+1,14,11);
  c.fillStyle = PAL.hairBlack;
  c.fillRect(x+5,y-1,16,4);
  c.fillRect(x+5,y+1,3,6); c.fillRect(x+18,y+1,3,6);
  c.restore();
}
function drawBride(c,x,y,frame,flip){
  c.save();
  if(flip){ c.translate(x+24,y); c.scale(-1,1); x=0; y=0; }
  c.fillStyle = PAL.dress;
  c.beginPath();
  c.moveTo(x+9,y+13); c.lineTo(x+17,y+13); c.lineTo(x+21,y+29); c.lineTo(x+5,y+29);
  c.closePath(); c.fill();
  c.fillStyle = PAL.dressTrim;
  c.fillRect(x+5,y+26,16,3);
  c.fillStyle = PAL.shoe;
  if(frame===0){ c.fillRect(x+7,y+28,4,2); c.fillRect(x+15,y+28,4,2); }
  else { c.fillRect(x+6,y+28,4,2); c.fillRect(x+16,y+28,4,2); }
  c.fillStyle = PAL.dress;
  c.fillRect(x+7,y+9,12,7);
  c.fillStyle = PAL.skin;
  c.fillRect(x+3,y+10,4,8); c.fillRect(x+19,y+10,4,8);
  c.fillStyle = PAL.skin;
  c.fillRect(x+6,y+0,14,10);
  c.fillStyle = PAL.hairBrown;
  c.fillRect(x+5,y-1,16,4);
  c.fillRect(x+4,y+1,3,11); c.fillRect(x+19,y+1,3,11);
  c.fillStyle = 'rgba(255,255,255,0.55)';
  c.fillRect(x+4,y-2,16,3);
  c.restore();
}
function drawDragon(c,x,y,flap){
  c.save();
  c.fillStyle = PAL.dragonWing;
  if(flap===0){
    c.beginPath(); c.moveTo(x+12,y+10); c.lineTo(x-6,y+2); c.lineTo(x+2,y+16); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(x+20,y+10); c.lineTo(x+38,y+2); c.lineTo(x+30,y+16); c.closePath(); c.fill();
  } else {
    c.beginPath(); c.moveTo(x+12,y+12); c.lineTo(x-4,y+18); c.lineTo(x+4,y+22); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(x+20,y+12); c.lineTo(x+36,y+18); c.lineTo(x+28,y+22); c.closePath(); c.fill();
  }
  c.fillStyle = PAL.dragonBody;
  c.fillRect(x+7,y+6,18,14);
  c.fillStyle = PAL.dragonBelly;
  c.fillRect(x+10,y+14,12,5);
  c.fillStyle = PAL.dragonBody;
  c.fillRect(x+18,y+2,10,8);
  c.fillStyle = '#e23b3b';
  c.fillRect(x+25,y+4,2,2);
  c.fillStyle = PAL.dragonBody;
  c.fillRect(x+2,y+10,6,4);
  c.restore();
}

/* ================= Player / Dragon state ================= */
const player = {
  col:startPos.col, row:startPos.row,
  x: startPos.col*TILE, y: startPos.row*TILE,
  fromX:0, fromY:0, toX:0, toY:0, moving:false, moveStart:0,
  side:'groom', frame:0, flip:false, pendingTile:'.',
  shakeTimer:0, invuln:0
};
const dragon = {
  idx: 0, x:0, y:0, fromX:0, fromY:0, toX:0, toY:0,
  stepTimer:0, flap:0
};
function initDragonPos(){
  const p = PATROL[0];
  dragon.x = dragon.fromX = dragon.toX = p.col*TILE;
  dragon.y = dragon.fromY = dragon.toY = p.row*TILE;
}
initDragonPos();

const MOVE_DUR = 150;
const DRAGON_STEP_MS = 430;

let STATE = 'title'; // title | select | game | opening | invite
let inputDir = null;
let smashVisible = false;
let lastTs = performance.now();

/* ================= Banner ================= */
let bannerTimeout = null;
function showBanner(text, dur){
  bannerEl.textContent = text;
  bannerEl.hidden = false;
  clearTimeout(bannerTimeout);
  bannerTimeout = setTimeout(()=>{ bannerEl.hidden = true; }, dur||2200);
}

/* ================= Tile drawing ================= */
function drawTile(t,x,y,col,row){
  if(t==='B'){
    ctx.fillStyle = '#274b1e'; ctx.fillRect(x,y,TILE,TILE);
    ctx.fillStyle = PAL.dragonWing;
    ctx.beginPath(); ctx.arc(x+TILE/2,y+TILE/2,TILE/2-3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#245a1e';
    ctx.beginPath(); ctx.arc(x+TILE/2-5,y+TILE/2-4,5,0,Math.PI*2); ctx.fill();
    return;
  }
  const shade = (col+row)%3===0 ? '#7ec850' : '#74bd48';
  ctx.fillStyle = shade;
  ctx.fillRect(x,y,TILE,TILE);
  if((col+row)%5===0){
    ctx.fillStyle = '#69ad3f';
    ctx.fillRect(x+4,y+18,3,6); ctx.fillRect(x+18,y+8,3,6);
  }
  if(t==='W'){
    ctx.fillStyle = '#4f9bdc';
    ctx.fillRect(x,y,TILE,TILE);
    ctx.fillStyle = '#2f6fb0';
    ctx.fillRect(x,y+TILE-6,TILE,6);
    const wobble = Math.sin(performance.now()/300 + col + row)*2;
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath();
    ctx.moveTo(x+2,y+9+wobble); ctx.lineTo(x+TILE-2,y+9+wobble);
    ctx.stroke();
  } else if(t==='H'){
    ctx.fillStyle = '#4a3018';
    ctx.beginPath(); ctx.ellipse(x+TILE/2,y+TILE/2,TILE/2-3,TILE/2-5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#241608';
    ctx.beginPath(); ctx.ellipse(x+TILE/2,y+TILE/2,TILE/2-8,TILE/2-9,0,0,Math.PI*2); ctx.fill();
  } else if(t==='P'){
    ctx.fillStyle = '#8a5a1e';
    ctx.fillRect(x+5,y+12,TILE-10,TILE-16);
    ctx.fillStyle = PAL.gold;
    ctx.fillRect(x+5,y+15,TILE-10,3);
    ctx.fillStyle = '#5a3a10';
    ctx.fillRect(x+4,y+10,TILE-8,4);
    ctx.fillStyle = '#f6d33c';
    ctx.fillRect(x+TILE/2-2,y+13,4,4);
  }
}

function renderAll(){
  ctx.clearRect(0,0,gameCanvas.width,gameCanvas.height);
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      drawTile(tileAt(c,r), c*TILE, r*TILE, c, r);
    }
  }
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(dragon.x+16, dragon.y+22, 14, 6, 0, 0, Math.PI*2);
  ctx.fill();

  let px = player.x, py = player.y - 4;
  if(player.shakeTimer>0){ px += Math.sin(performance.now()/20)*2; }
  if(player.side==='bride') drawBride(ctx, px, py, player.frame, player.flip);
  else drawGroom(ctx, px, py, player.frame, player.flip);

  drawDragon(ctx, dragon.x-2, dragon.y-6, dragon.flap);
}

/* ================= Movement logic ================= */
function attemptMove(dir){
  if(player.moving || STATE!=='game') return;
  let nc=player.col, nr=player.row;
  if(dir==='up') nr--;
  else if(dir==='down') nr++;
  else if(dir==='left'){ nc--; player.flip=true; }
  else if(dir==='right'){ nc++; player.flip=false; }
  const t = tileAt(nc,nr);
  if(t==='B' || t==='W' || t==='P'){
    player.shakeTimer = 180;
    sfxBlocked();
    return;
  }
  player.col = nc; player.row = nr;
  player.pendingTile = t;
  player.fromX = player.x; player.fromY = player.y;
  player.toX = nc*TILE; player.toY = nr*TILE;
  player.moving = true; player.moveStart = performance.now();
  player.frame = 1 - player.frame;
  sfxStep();
}

function onMoveComplete(){
  player.moving = false;
  if(player.pendingTile === 'H'){
    doSink();
  } else {
    updateSmashVisibility();
  }
}

function doSink(){
  STATE = 'opening';
  sfxSink();
  showBanner("Oh no, a hole! Back to the start~", 2200);
  setTimeout(()=>{
    player.col = startPos.col; player.row = startPos.row;
    player.x = player.fromX = player.toX = startPos.col*TILE;
    player.y = player.fromY = player.toY = startPos.row*TILE;
    player.invuln = 700;
    STATE = 'game';
    updateSmashVisibility();
  }, 650);
}

function doCaught(){
  STATE = 'opening';
  sfxCaught();
  showBanner("The dragon caught you!! Back to the start!", 2400);
  setTimeout(()=>{
    player.col = startPos.col; player.row = startPos.row;
    player.x = player.fromX = player.toX = startPos.col*TILE;
    player.y = player.fromY = player.toY = startPos.row*TILE;
    player.invuln = 900;
    dragon.idx = Math.floor(PATROL.length/2);
    STATE = 'game';
    updateSmashVisibility();
  }, 500);
}

function updateSmashVisibility(){
  const d = Math.max(Math.abs(player.col-prizePos.col), Math.abs(player.row-prizePos.row));
  smashVisible = (d<=1 && STATE==='game');
  smashBtn.hidden = !smashVisible;
}

function triggerSmash(){
  if(STATE!=='game' || !smashVisible) return;
  STATE = 'opening';
  smashBtn.hidden = true;
  sfxUnlock();
  showBanner("The chest bursts open!! ✨", 1600);
  setTimeout(()=>{
    STATE = 'invite';
    gameCanvas.hidden = true;
    bannerEl.hidden = true;
    inviteScreen.hidden = false;
  }, 950);
}

/* ================= Main loop ================= */
function tick(now){
  const dt = now - lastTs; lastTs = now;

  if(STATE==='game'){
    if(!player.moving && inputDir) attemptMove(inputDir);
    if(player.moving){
      const t = Math.min(1, (now-player.moveStart)/MOVE_DUR);
      player.x = player.fromX + (player.toX-player.fromX)*t;
      player.y = player.fromY + (player.toY-player.fromY)*t;
      if(t>=1){ player.x=player.toX; player.y=player.toY; onMoveComplete(); }
    }
    if(player.shakeTimer>0) player.shakeTimer -= dt;
    if(player.invuln>0) player.invuln -= dt;

    dragon.stepTimer += dt;
    if(dragon.stepTimer >= DRAGON_STEP_MS){
      dragon.stepTimer = 0;
      dragon.idx = (dragon.idx+1) % PATROL.length;
      const p = PATROL[dragon.idx];
      dragon.fromX = dragon.x; dragon.fromY = dragon.y;
      dragon.toX = p.col*TILE; dragon.toY = p.row*TILE;
      dragon.flap = 1 - dragon.flap;
    }
    const dt2 = Math.min(1, dragon.stepTimer/DRAGON_STEP_MS);
    dragon.x = dragon.fromX + (dragon.toX-dragon.fromX)*dt2;
    dragon.y = dragon.fromY + (dragon.toY-dragon.fromY)*dt2;

    if(player.invuln<=0 && STATE==='game'){
      if(Math.abs(player.x-dragon.x)<18 && Math.abs(player.y-dragon.y)<18){
        doCaught();
      }
    }
  }

  if(STATE==='game' || STATE==='opening'){
    renderAll();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ================= State transitions ================= */
function goSelect(){
  STATE = 'select';
  titleScreen.hidden = true;
  selectScreen.hidden = false;
  drawPortraits();
}
function drawPortraits(){
  const gc = document.getElementById('portraitGroom').getContext('2d');
  gc.clearRect(0,0,56,64); drawGroom(gc,16,14,0,false);
  const bc = document.getElementById('portraitBride').getContext('2d');
  bc.clearRect(0,0,56,64); drawBride(bc,16,10,0,false);
}
function goGame(side){
  player.side = side;
  player.col = startPos.col; player.row = startPos.row;
  player.x = player.fromX = player.toX = startPos.col*TILE;
  player.y = player.fromY = player.toY = startPos.row*TILE;
  player.invuln = 500;
  dragon.idx = 0; initDragonPos(); dragon.stepTimer = 0;
  STATE = 'game';
  selectScreen.hidden = true;
  gameCanvas.hidden = false;
  smashBtn.hidden = true;
  showBanner("Walk on the grass. Avoid holes, water & bushes. Watch the sky!", 4200);
}
function goTitleReset(){
  STATE = 'title';
  gameCanvas.hidden = true;
  inviteScreen.hidden = true;
  selectScreen.hidden = true;
  bannerEl.hidden = true;
  smashBtn.hidden = true;
  titleScreen.hidden = false;
}

/* ================= Input wiring ================= */
function beginFromTitle(){
  ensureAudio(); startMusic();
  if(STATE==='title') goSelect();
}
titleScreen.addEventListener('click', beginFromTitle);
document.addEventListener('keydown', (e)=>{
  if(STATE==='title' && (e.key==='Enter' || e.key===' ')){ beginFromTitle(); return; }
  const k = e.key;
  if(k==='ArrowUp'||k==='w'||k==='W') inputDir='up';
  else if(k==='ArrowDown'||k==='s'||k==='S') inputDir='down';
  else if(k==='ArrowLeft'||k==='a'||k==='A') inputDir='left';
  else if(k==='ArrowRight'||k==='d'||k==='D') inputDir='right';
  else if(k==='Enter'||k===' '){ if(STATE==='game') triggerSmash(); }
});
document.addEventListener('keyup', (e)=>{
  const k = e.key;
  const map = {ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',
    ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
  if(map[k] && inputDir===map[k]) inputDir = null;
});

document.querySelectorAll('.charBtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{ ensureAudio(); goGame(btn.dataset.side); });
});

document.querySelectorAll('#dpad button').forEach(btn=>{
  const dir = btn.dataset.dir;
  const start = (ev)=>{ ev.preventDefault(); ensureAudio(); inputDir = dir; };
  const end = (ev)=>{ ev.preventDefault(); if(inputDir===dir) inputDir=null; };
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', end);
  btn.addEventListener('pointerleave', end);
  btn.addEventListener('pointercancel', end);
});
document.getElementById('aBtn').addEventListener('click', ()=>{
  ensureAudio();
  if(STATE==='title'){ beginFromTitle(); return; }
  if(STATE==='game') triggerSmash();
});
smashBtn.addEventListener('click', triggerSmash);
document.getElementById('bBtn').addEventListener('click', ()=>{ /* decorative / reserved */ });
document.getElementById('muteBtn').addEventListener('click', toggleMusic);
document.getElementById('menuBtn').addEventListener('click', goTitleReset);

/* ================= Invite screen population ================= */
document.getElementById('coupleTitle').textContent = CONFIG.groomName.toUpperCase() + ' & ' + CONFIG.brideName.toUpperCase();
document.getElementById('titleLogo').innerHTML = CONFIG.groomName.toUpperCase() + '<br>&amp;<br>' + CONFIG.brideName.toUpperCase();
document.getElementById('labelGroom').textContent = CONFIG.groomName.toUpperCase() + ' SIDE';
document.getElementById('labelBride').textContent = CONFIG.brideName.toUpperCase() + ' SIDE';
document.getElementById('rowDate').textContent = '📅 DATE: ' + CONFIG.weddingDateDisplay;
document.getElementById('rowTime').textContent = '⏰ TIME: ' + CONFIG.weddingTime;
document.getElementById('rowVenue').textContent = '📍 VENUE: ' + CONFIG.venueName;
document.getElementById('rowAddress').textContent = CONFIG.venueAddress;
document.getElementById('mapLink').href = CONFIG.mapsUrl;

function updateCountdown(){
  const diff = new Date(CONFIG.weddingDateISO) - new Date();
  const el = document.getElementById('countdown');
  if(diff<=0){ el.textContent = 'THE BIG DAY IS HERE!'; return; }
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  el.textContent = d + 'd ' + h + 'h ' + m + 'm TO GO';
}
updateCountdown();
setInterval(updateCountdown, 1000);

/* ================= Tabs ================= */
document.querySelectorAll('.tabBtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tabPanel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='wishes') renderWishes();
  });
});

/* ================= Storage helpers ================= */
function getList(key){
  try{ return JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){ return []; }
}
function pushList(key,item){
  const list = getList(key);
  list.unshift(item);
  localStorage.setItem(key, JSON.stringify(list.slice(0,200)));
}
function postIfConfigured(endpoint,payload){
  if(!endpoint) return;
  fetch(endpoint, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  }).catch(()=>{ /* silent — still saved locally */ });
}

/* ================= RSVP form ================= */
document.getElementById('rsvpForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const name = document.getElementById('rsvpName').value.trim();
  if(!name) return;
  const entry = {
    name,
    attending: document.getElementById('rsvpAttend').value,
    guests: document.getElementById('rsvpGuests').value,
    note: document.getElementById('rsvpNote').value.trim(),
    ts: Date.now()
  };
  pushList('wedding_rsvp', entry);
  postIfConfigured(CONFIG.rsvpEndpoint, entry);
  ensureAudio(); sfxSubmit();
  document.getElementById('rsvpStatus').textContent = 'Thanks ' + name + '! Your RSVP is saved. 🎮';
  e.target.reset();
});

/* ================= Wishes form ================= */
function renderWishes(){
  const list = getList('wedding_wishes');
  const el = document.getElementById('wishList');
  if(list.length===0){
    el.innerHTML = '<p style="color:#9a8a6a;">No wishes yet — be the first!</p>';
    return;
  }
  el.innerHTML = list.map(w=>{
    const d = new Date(w.ts);
    const when = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    return '<div class="wishCard"><b>'+escapeHtml(w.name)+'</b><div>'+escapeHtml(w.message)+'</div><div class="when">'+when+'</div></div>';
  }).join('');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
document.getElementById('wishForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const name = document.getElementById('wishName').value.trim();
  const message = document.getElementById('wishMsg').value.trim();
  if(!name || !message) return;
  const entry = { name, message, ts: Date.now() };
  pushList('wedding_wishes', entry);
  postIfConfigured(CONFIG.wishEndpoint, entry);
  ensureAudio(); sfxSubmit();
  document.getElementById('wishStatus').textContent = 'Thank you for your wish, ' + name + '! 💌';
  e.target.reset();
  renderWishes();
});

})();
</script>
</body>

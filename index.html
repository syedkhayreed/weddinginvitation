<!DOCTYPE html>
<!--
  ================================================================
  GROOM & BRIDE'S WEDDING QUEST — full-screen 8-bit invitation
  ================================================================
  HOW TO CUSTOMIZE:
    See the "CONFIG" block near the top of the <script> tag —
    names, date, venue, and optional form endpoints.

  HOW TO DEPLOY ON GITHUB PAGES:
    1. Upload this file as index.html to your repo root.
    2. Repo Settings -> Pages -> Source: Deploy from a branch,
       Branch: main, folder: / (root). Save.
    3. Your link: https://<username>.github.io/<repo-name>/

  RSVP / WISHES are saved to the guest's own browser (localStorage)
  so this works fully for testing right now. Set CONFIG.rsvpEndpoint
  / CONFIG.wishEndpoint to a Formspree URL to collect real responses.
  ================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1b0d">
<title>Groom &amp; Bride — Wedding Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbf3da; --ink:#2a2434; --accent:#e8517a; --gold:#f6d33c;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden]{ display:none !important; }
  html,body{
    margin:0; height:100%; overflow:hidden; background:#0d1b0d;
    font-family:'VT323',monospace; color:var(--ink);
    touch-action:none;
  }
  .pixel{ font-family:'Press Start 2P',monospace; }

  #gameCanvas{
    position:fixed; inset:0; width:100vw; height:100dvh;
    image-rendering:pixelated; display:block; z-index:1; background:#0d1b0d;
  }

  .panel{
    position:fixed; inset:0; z-index:2; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:linear-gradient(180deg,#274b1e,#0d1b0d 85%);
    color:var(--paper); padding:20px;
  }
  #titleScreen .logo{
    font-size:24px; line-height:1.5; color:var(--gold);
    text-shadow:2px 2px 0 #6b4a00; margin-bottom:8px;
  }
  #titleScreen .subtitle{ font-size:12px; letter-spacing:2px; margin-bottom:30px; color:#cfe8c0;}
  #titleScreen .blink{ font-size:13px; animation:blink 1s steps(1) infinite; color:#fff; }
  @keyframes blink{ 50%{ opacity:0; } }

  #selectScreen .ptitle{ font-size:13px; margin-bottom:14px; color:#fff; letter-spacing:1px; }
  #mapPreview{ image-rendering:pixelated; background:#12220c; border:3px solid #cfe8c0; border-radius:6px; margin-bottom:18px; }
  #mapPreviewCaption{ font-size:13px; color:#cfe8c0; margin-bottom:20px; }
  .choices{ display:flex; gap:18px; }
  .charBtn{
    background:#1c3a14; border:3px solid #cfe8c0; border-radius:8px;
    padding:10px 8px; display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer; color:var(--paper); font-family:'Press Start 2P',monospace; font-size:9px;
  }
  .charBtn:active{ transform:translateY(2px); }
  .charBtn canvas{ image-rendering:pixelated; background:#12220c; border-radius:4px; }

  #banner{
    position:fixed; left:8px; right:8px; top:calc(env(safe-area-inset-top,0px) + 10px); z-index:5;
    background:rgba(10,10,20,.85); color:#fff; border:2px solid var(--gold);
    border-radius:6px; padding:8px 10px; font-size:14px; text-align:center; line-height:1.3;
  }
  #smashBtn{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    z-index:6; font-family:'Press Start 2P',monospace; font-size:13px;
    background:var(--gold); color:#4a2e00; border:3px solid #c79a10; border-radius:8px;
    padding:12px 18px; box-shadow:0 4px 0 #8a6a00; cursor:pointer;
    animation:pulse 1s infinite;
  }
  @keyframes pulse{ 0%,100%{ transform:translate(-50%,-50%) scale(1); } 50%{ transform:translate(-50%,-50%) scale(1.08); } }

  #compass{
    position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); right:14px; z-index:6;
    width:54px; height:54px; border-radius:50%; background:rgba(10,10,20,.55);
    border:2px solid var(--gold); display:flex; align-items:center; justify-content:center;
  }
  #compassArrow{ font-size:22px; color:var(--gold); transition:transform .15s linear; }

  #inviteScreen{ background:var(--paper); color:var(--ink); text-align:left; padding:0; overflow:hidden; }
  .tabs{ display:flex; width:100%; padding-top:env(safe-area-inset-top,0px); }
  .tabBtn{
    flex:1; padding:11px 2px; border:none; background:#d8cba0; color:#5a4a2a;
    font-family:'Press Start 2P',monospace; font-size:9px; cursor:pointer; border-bottom:3px solid #b8a878;
  }
  .tabBtn.active{ background:var(--paper); color:var(--accent); border-bottom:3px solid var(--accent); }
  .tabPanels{ width:100%; flex:1; overflow-y:auto; padding:16px 18px 24px; max-width:520px; margin:0 auto; }
  .tabPanel{ display:none; }
  .tabPanel.active{ display:block; }
  .tabPanel h2{ font-family:'Press Start 2P',monospace; font-size:16px; color:var(--accent); margin:2px 0 10px; line-height:1.5;}
  .tabPanel p{ font-size:17px; margin:4px 0; }
  .infoRow{ font-size:18px; margin:9px 0; }
  .infoRow.small{ font-size:15px; color:#6a5a3a; }
  #countdown{
    margin-top:14px; font-family:'Press Start 2P',monospace; font-size:12px;
    background:#2a2434; color:var(--gold); padding:10px; border-radius:6px; text-align:center;
  }
  #mapLink{
    display:inline-block; margin-top:12px; font-family:'Press Start 2P',monospace; font-size:10px;
    background:var(--accent); color:#fff; padding:9px 11px; border-radius:6px; text-decoration:none;
  }
  form label{ display:block; font-size:16px; margin:11px 0 4px; color:#4a3a1a; }
  form input, form select, form textarea{
    width:100%; font-family:'VT323',monospace; font-size:18px; padding:8px 9px;
    border:2px solid #b8a878; border-radius:5px; background:#fffdf5; color:var(--ink);
  }
  form textarea{ resize:vertical; min-height:56px; }
  form button{
    margin-top:13px; width:100%; font-family:'Press Start 2P',monospace; font-size:11px;
    background:var(--accent); color:#fff; border:none; border-radius:6px; padding:12px; cursor:pointer;
    box-shadow:0 3px 0 #a83358;
  }
  form button:active{ transform:translateY(2px); box-shadow:none; }
  #rsvpStatus,#wishStatus{ margin-top:9px; font-size:16px; color:#1f7a3a; min-height:18px; }
  .wishCard{
    background:#fff; border:2px solid #d8cba0; border-radius:6px; padding:9px 11px; margin-top:9px;
  }
  .wishCard b{ color:var(--accent); }
  .wishCard .when{ font-size:13px; color:#9a8a6a; }

  #dpad{
    position:fixed; left:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 22px); z-index:7;
    width:104px; height:104px;
  }
  #dpad button{
    position:absolute; width:34px; height:34px; background:rgba(43,36,56,.75); color:#cfc8ea;
    border:2px solid rgba(23,19,31,.8); border-radius:5px; font-size:15px; cursor:pointer;
  }
  #dpad button:active{ background:rgba(68,58,92,.9); }
  #dpad button[data-dir="up"]{ left:35px; top:0; }
  #dpad button[data-dir="left"]{ left:0; top:35px; }
  #dpad button[data-dir="right"]{ left:70px; top:35px; }
  #dpad button[data-dir="down"]{ left:35px; top:70px; }

  #abBtns{
    position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom,0px) + 22px); z-index:7;
    display:flex; align-items:flex-end; gap:12px;
  }
  #abBtns button{
    width:56px; height:56px; border-radius:50%; border:2px solid rgba(23,19,31,.8);
    font-family:'Press Start 2P',monospace; font-size:14px; cursor:pointer; opacity:.9;
  }
  #aBtn{ background:var(--accent); color:#fff; }
  #bBtn{ background:#5a4d8a; color:#fff; margin-bottom:20px; }

  #startSelect{
    position:fixed; left:14px; top:calc(env(safe-area-inset-top,0px) + 14px); z-index:7;
    display:flex; flex-direction:column; gap:8px;
  }
  #startSelect button{
    font-family:'Press Start 2P',monospace; font-size:8px; background:rgba(43,36,56,.75); color:#cfc8ea;
    border:2px solid rgba(23,19,31,.8); border-radius:12px; padding:7px 10px; cursor:pointer;
  }
  a{ color:inherit; }
</style>
</head>
<body>

<canvas id="gameCanvas" hidden></canvas>

<div id="titleScreen" class="panel">
  <div class="logo pixel" id="titleLogo">GROOM<br>&amp;<br>BRIDE</div>
  <div class="subtitle pixel">WEDDING QUEST</div>
  <div class="blink pixel">PRESS START</div>
</div>

<div id="selectScreen" class="panel" hidden>
  <div class="ptitle pixel">THE LAND AHEAD</div>
  <canvas id="mapPreview" width="150" height="150"></canvas>
  <div id="mapPreviewCaption">Find the chest. Avoid everything else.</div>
  <div class="choices">
    <button class="charBtn" data-side="groom">
      <canvas id="portraitGroom" width="56" height="64"></canvas>
      <span id="labelGroom">GROOM SIDE</span>
    </button>
    <button class="charBtn" data-side="bride">
      <canvas id="portraitBride" width="56" height="64"></canvas>
      <span id="labelBride">BRIDE SIDE</span>
    </button>
  </div>
</div>

<div id="banner" hidden></div>
<button id="smashBtn" class="pixel" hidden>SMASH!</button>
<div id="compass" hidden><div id="compassArrow">➤</div></div>

<div id="inviteScreen" class="panel" hidden style="justify-content:flex-start;">
  <div class="tabs">
    <button class="tabBtn active pixel" data-tab="details">DETAILS</button>
    <button class="tabBtn pixel" data-tab="rsvp">RSVP</button>
    <button class="tabBtn pixel" data-tab="wishes">WISHES</button>
  </div>
  <div class="tabPanels">
    <div class="tabPanel active" id="tab-details">
      <h2 id="coupleTitle">GROOM &amp; BRIDE</h2>
      <p>are getting married &mdash; and you're invited!</p>
      <div class="infoRow" id="rowDate">📅 DATE: —</div>
      <div class="infoRow" id="rowTime">⏰ TIME: —</div>
      <div class="infoRow" id="rowVenue">📍 VENUE: —</div>
      <div class="infoRow small" id="rowAddress"></div>
      <a id="mapLink" class="pixel" target="_blank" rel="noopener">OPEN MAP ➜</a>
      <div id="countdown">CALCULATING...</div>
    </div>
    <div class="tabPanel" id="tab-rsvp">
      <h2>RSVP</h2>
      <form id="rsvpForm">
        <label for="rsvpName">YOUR NAME</label>
        <input id="rsvpName" required maxlength="60">
        <label for="rsvpAttend">ATTENDING?</label>
        <select id="rsvpAttend">
          <option value="yes">YES, COUNT ME IN!</option>
          <option value="no">SORRY, CAN'T MAKE IT</option>
        </select>
        <label for="rsvpGuests">GUESTS (incl. you)</label>
        <input id="rsvpGuests" type="number" min="1" max="10" value="1">
        <label for="rsvpNote">NOTE (optional)</label>
        <textarea id="rsvpNote" maxlength="200"></textarea>
        <button type="submit" class="pixel">SEND RSVP</button>

    </div>
    <div class="tabPanel" id="tab-wishes">
      <h2>WISHES</h2>
      <form id="wishForm">
        <label for="wishName">YOUR NAME</label>
        <input id="wishName" required maxlength="60">
        <label for="wishMsg">YOUR WISH</label>
        <textarea id="wishMsg" required maxlength="240"></textarea>
        <button type="submit" class="pixel">SEND WISH</button>
      </form>
      <div id="wishStatus"></div>
      <div id="wishList" style="margin-top:10px;"></div>
    </div>
  </div>
</div>

<div id="dpad" hidden>
  <button data-dir="up">▲</button>
  <button data-dir="left">◀</button>
  <button data-dir="right">▶</button>
  <button data-dir="down">▼</button>
</div>
<div id="abBtns" hidden>
  <button id="bBtn" class="pixel">B</button>
  <button id="aBtn" class="pixel">A</button>
</div>
<div id="startSelect" hidden>
  <button id="muteBtn" class="pixel">🔊 SND</button>
  <button id="menuBtn" class="pixel">☰ MENU</button>
</div>

<script>
(function(){
"use strict";

/* ================= CONFIG — EDIT ME ================= */
const CONFIG = {
  groomName: "Groom",
  brideName: "Bride",
  weddingDateDisplay: "Saturday, 12 December 2026",
  weddingDateISO: "2026-12-12T16:00:00",
  weddingTime: "4:00 PM Ceremony • 7:00 PM Reception",
  venueName: "Grand Ballroom, Sunway Resort Hotel",
  venueAddress: "Persiaran Lagoon, Bandar Sunway, 47500 Petaling Jaya, Selangor",
  mapsUrl: "",
  rsvpEndpoint: "",
  wishEndpoint: ""
};
if(!CONFIG.mapsUrl){
  CONFIG.mapsUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(CONFIG.venueAddress);
}

/* ================= DOM refs ================= */
const titleScreen = document.getElementById('titleScreen');
const selectScreen = document.getElementById('selectScreen');
const gameCanvas = document.getElementById('gameCanvas');
const inviteScreen = document.getElementById('inviteScreen');
const bannerEl = document.getElementById('banner');
const smashBtn = document.getElementById('smashBtn');
const compassEl = document.getElementById('compass');
const compassArrow = document.getElementById('compassArrow');
const dpadEl = document.getElementById('dpad');
const abBtnsEl = document.getElementById('abBtns');
const startSelectEl = document.getElementById('startSelect');
const ctx = gameCanvas.getContext('2d');

/* ================= Map generation ================= */
const TILE = 40;
const COLS = 26, ROWS = 26;
let MAP_ROWS = [];
let startPos = null, prizePos = null;
let WORLD_W = COLS*TILE, WORLD_H = ROWS*TILE;

function tileAt(col,row){
  if(row<0||row>=ROWS||col<0||col>=COLS) return 'B';
  return MAP_ROWS[row][col];
}
function rnd(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function generateMap(){
  const grid = [];
  for(let r=0;r<ROWS;r++){
    const row = [];
    for(let c=0;c<COLS;c++){
      row.push((r===0||r===ROWS-1||c===0||c===COLS-1) ? 'B' : '.');
    }
    grid.push(row);
  }

  const sCol = rnd(9,COLS-10), sRow = rnd(ROWS-6,ROWS-3);
  const pCol = rnd(9,COLS-10), pRow = rnd(Math.floor(ROWS/2)-3, Math.floor(ROWS/2)+2);
  startPos = {col:sCol,row:sRow};
  prizePos = {col:pCol,row:pRow};

  const protectedSet = new Set();
  const key = (c,r)=> c+','+r;
  function markProtected(c,r){ protectedSet.add(key(c,r)); }
  for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
    markProtected(sCol+dc,sRow+dr); markProtected(pCol+dc,pRow+dr);
  }

  // carve a wiggly guaranteed path from start toward prize
  let cx=sCol, cy=sRow, guard=0;
  while(Math.max(Math.abs(cx-pCol),Math.abs(cy-pRow))>1 && guard<900){
    guard++;
    const dx = pCol-cx, dy = pRow-cy;
    let stepx=0, stepy=0;
    if(Math.random()<0.55){
      if(Math.abs(dx)>=Math.abs(dy)) stepx = dx>0?1:-1;
      else stepy = dy>0?1:-1;
    } else {
      const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
      const d = dirs[rnd(0,3)]; stepx=d[0]; stepy=d[1];
    }
    cx = Math.min(Math.max(cx+stepx,1),COLS-2);
    cy = Math.min(Math.max(cy+stepy,1),ROWS-2);
    grid[cy][cx] = '.';
    markProtected(cx,cy);
  }
  grid[sRow][sCol] = 'S';
  grid[pRow][pCol] = 'P';
  markProtected(sCol,sRow); markProtected(pCol,pRow);

  function freeCell(){
    for(let tries=0;tries<250;tries++){
      const c = rnd(2,COLS-3), r = rnd(2,ROWS-3);
      if(protectedSet.has(key(c,r))) continue;
      if(grid[r][c]!=='.') continue;
      return {c,r};
    }
    return null;
  }
  function scatterBlob(ch,minSize,maxSize,count){
    for(let i=0;i<count;i++){
      const f = freeCell();
      if(!f) continue;
      let cx2=f.c, cy2=f.r, placed=0, guard2=0;
      const targetSize = rnd(minSize,maxSize);
      while(placed<targetSize && guard2<40){
        guard2++;
        if(cx2>=1 && cx2<=COLS-2 && cy2>=1 && cy2<=ROWS-2 &&
           !protectedSet.has(key(cx2,cy2)) && grid[cy2][cx2]==='.'){
          grid[cy2][cx2]=ch; placed++;
        }
        const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
        const d = dirs[rnd(0,3)];
        cx2+=d[0]; cy2+=d[1];
      }
    }
  }
  scatterBlob('W',2,5,7);   // scattered ponds
  scatterBlob('B',1,4,10);  // scattered bushes
  scatterBlob('H',3,6,4);   // a few BIG holes
  for(let i=0;i<15;i++){    // many small individual holes
    const f = freeCell();
    if(f) grid[f.r][f.c]='H';
  }

  MAP_ROWS = grid.map(row=>row.join(''));
}

/* ================= Audio ================= */
let audioCtx = null;
let musicOn = true;
let musicTimeout = null;

function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
  }
  if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
}
function beepAt(freq,dur,type,vol,startTime){
  if(!audioCtx || freq<=0) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(vol, startTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(startTime); osc.stop(startTime + dur + 0.02);
}
function beep(freq,dur,type,vol,delay){
  if(!audioCtx) return;
  beepAt(freq,dur,type,vol==null?0.14:vol, audioCtx.currentTime + (delay||0));
}
function sfxStep(){ if(musicOn) beep(500+Math.random()*60, 0.045, 'square', 0.045, 0); }
function sfxBlocked(){ beep(130, 0.12, 'sawtooth', 0.12, 0); }
function sfxSink(){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(500,t0);
  osc.frequency.exponentialRampToValueAtTime(70,t0+0.6);
  gain.gain.setValueAtTime(0.18,t0);
  gain.gain.exponentialRampToValueAtTime(0.0001,t0+0.65);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+0.7);
}
function sfxCaught(){ [440,370,310,220].forEach((f,i)=>beep(f,0.18,'square',0.16,i*0.15)); }
function sfxRoar(){ [180,140,100].forEach((f,i)=>beep(f,0.22,'sawtooth',0.14,i*0.1)); }
function sfxUnlock(){ [523,659,784,1046].forEach((f,i)=>beep(f,0.14,'square',0.16,i*0.12)); }
function sfxSubmit(){ [660,880,990].forEach((f,i)=>beep(f,0.12,'triangle',0.16,i*0.1)); }

const MELODY = [
  [523,0.2],[659,0.2],[784,0.2],[659,0.2],
  [523,0.2],[0,0.2],[587,0.2],[523,0.2],
  [440,0.4],[0,0.3],
  [523,0.2],[659,0.2],[784,0.2],[880,0.2],
  [784,0.4],[0,0.4]
];
function scheduleMusicLoop(){
  if(!musicOn || !audioCtx) return;
  let t = audioCtx.currentTime + 0.05;
  const start = t;
  MELODY.forEach(([f,d])=>{
    if(f>0) beepAt(f, d*0.85, 'square', 0.05, t);
    t += d;
  });
  musicTimeout = setTimeout(scheduleMusicLoop, (t-start)*1000);
}
function startMusic(){
  ensureAudio();
  if(musicOn && audioCtx && !musicTimeout) scheduleMusicLoop();
}
function toggleMusic(){
  musicOn = !musicOn;
  document.getElementById('muteBtn').textContent = musicOn ? '🔊 SND' : '🔈 SND';
  if(musicOn){ startMusic(); }
  else { clearTimeout(musicTimeout); musicTimeout=null; }
}

/* ================= Sprites ================= */
const PAL = {
  skin:'#ffcf9c', hairBlack:'#221a1a', hairBrown:'#5c3a21',
  suit:'#1c1c24', shirt:'#ffffff', tie:'#c81e3a',
  dress:'#ff7fac', dressTrim:'#ffffff', shoe:'#33241a',
  dragonBody:'#4a8a3a', dragonBelly:'#dede6a', dragonWing:'#2f6b26',
  gold:'#f6d33c'
};
function drawGroom(c,x,y,frame,flip){
  c.save();
  if(flip){ c.translate(x+24,y); c.scale(-1,1); x=0; y=0; }
  c.fillStyle = PAL.suit;
  if(frame===0){ c.fillRect(x+6,y+22,6,7); c.fillRect(x+14,y+22,6,7); }
  else { c.fillRect(x+5,y+22,6,7); c.fillRect(x+15,y+22,6,7); }
  c.fillStyle = PAL.shoe;
  c.fillRect(x+5,y+27,7,3); c.fillRect(x+13,y+27,7,3);
  c.fillStyle = PAL.suit;
  c.fillRect(x+4,y+11,18,13);
  c.fillStyle = PAL.shirt;
  c.fillRect(x+10,y+11,6,11);
  c.fillStyle = PAL.tie;
  c.fillRect(x+12,y+12,2,9);
  c.fillStyle = PAL.suit;
  c.fillRect(x+1,y+12,4,9); c.fillRect(x+21,y+12,4,9);
  c.fillStyle = PAL.skin;
  c.fillRect(x+6,y+1,14,11);
  c.fillStyle = PAL.hairBlack;
  c.fillRect(x+5,y-1,16,4);
  c.fillRect(x+5,y+1,3,6); c.fillRect(x+18,y+1,3,6);
  c.restore();
}
function drawBride(c,x,y,frame,flip){
  c.save();
  if(flip){ c.translate(x+24,y); c.scale(-1,1); x=0; y=0; }
  c.fillStyle = PAL.dress;
  c.beginPath();
  c.moveTo(x+9,y+13); c.lineTo(x+17,y+13); c.lineTo(x+21,y+29); c.lineTo(x+5,y+29);
  c.closePath(); c.fill();
  c.fillStyle = PAL.dressTrim;
  c.fillRect(x+5,y+26,16,3);
  c.fillStyle = PAL.shoe;
  if(frame===0){ c.fillRect(x+7,y+28,4,2); c.fillRect(x+15,y+28,4,2); }
  else { c.fillRect(x+6,y+28,4,2); c.fillRect(x+16,y+28,4,2); }
  c.fillStyle = PAL.dress;
  c.fillRect(x+7,y+9,12,7);
  c.fillStyle = PAL.skin;
  c.fillRect(x+3,y+10,4,8); c.fillRect(x+19,y+10,4,8);
  c.fillStyle = PAL.skin;
  c.fillRect(x+6,y+0,14,10);
  c.fillStyle = PAL.hairBrown;
  c.fillRect(x+5,y-1,16,4);
  c.fillRect(x+4,y+1,3,11); c.fillRect(x+19,y+1,3,11);
  c.fillStyle = 'rgba(255,255,255,0.55)';
  c.fillRect(x+4,y-2,16,3);
  c.restore();
}
function drawDragon(c,x,y,flap){
  c.save();
  c.fillStyle = PAL.dragonWing;
  if(flap===0){
    c.beginPath(); c.moveTo(x+12,y+10); c.lineTo(x-6,y+2); c.lineTo(x+2,y+16); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(x+20,y+10); c.lineTo(x+38,y+2); c.lineTo(x+30,y+16); c.closePath(); c.fill();
  } else {
    c.beginPath(); c.moveTo(x+12,y+12); c.lineTo(x-4,y+18); c.lineTo(x+4,y+22); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(x+20,y+12); c.lineTo(x+36,y+18); c.lineTo(x+28,y+22); c.closePath(); c.fill();
  }
  c.fillStyle = PAL.dragonBody;
  c.fillRect(x+7,y+6,18,14);
  c.fillStyle = PAL.dragonBelly;
  c.fillRect(x+10,y+14,12,5);
  c.fillStyle = PAL.dragonBody;
  c.fillRect(x+18,y+2,10,8);
  c.fillStyle = '#e23b3b';
  c.fillRect(x+25,y+4,2,2);
  c.fillStyle = PAL.dragonBody;
  c.fillRect(x+2,y+10,6,4);
  c.restore();
}

/* ================= Player / Dragon state ================= */
const player = {
  col:0, row:0, x:0, y:0,
  fromX:0, fromY:0, toX:0, toY:0, moving:false, moveStart:0,
  side:'groom', frame:0, flip:false, pendingTile:'.',
  shakeTimer:0, invuln:0
};
const dragon = {
  x:0, y:0, fromX:0, fromY:0, toX:0, toY:0,
  stepTimer:0, flap:0, chasing:false
};
const DETECT_RADIUS = TILE*6.5;
const CHASE_STEP_MS = 420;
const PATROL_STEP_MS = 850;

function spawnDragonAround(px,py,minDist,maxDist){
  const angle = Math.random()*Math.PI*2;
  const dist = minDist + Math.random()*(maxDist-minDist);
  let dx = px + Math.cos(angle)*dist;
  let dy = py + Math.sin(angle)*dist;
  dx = Math.max(TILE, Math.min(WORLD_W-TILE*2, dx));
  dy = Math.max(TILE, Math.min(WORLD_H-TILE*2, dy));
  dragon.x = dragon.fromX = dragon.toX = dx;
  dragon.y = dragon.fromY = dragon.toY = dy;
  dragon.chasing = false;
  dragon.stepTimer = 0;
}
function initDragon(){
  dragon.active = false;
  dragon.spawnTimer = 0;
  dragon.spawnDelay = 4000 + Math.random()*3000;
  dragon.chasing = false;
  dragon.stepTimer = 0;
}

const MOVE_DUR = 150;
let STATE = 'title'; // title | select | game | opening | invite
let inputDir = null;
let smashVisible = false;
let lastTs = performance.now();

/* ================= Camera / canvas sizing ================= */
let viewW=window.innerWidth, viewH=window.innerHeight;
function resizeCanvas(){
  viewW = window.innerWidth; viewH = window.innerHeight;
  const dpr = window.devicePixelRatio||1;
  gameCanvas.width = Math.round(viewW*dpr);
  gameCanvas.height = Math.round(viewH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function getCamera(){
  let camX = (player.x+20) - viewW/2;
  let camY = (player.y+20) - viewH/2;
  camX = WORLD_W<=viewW ? -(viewW-WORLD_W)/2 : Math.max(0, Math.min(camX, WORLD_W-viewW));
  camY = WORLD_H<=viewH ? -(viewH-WORLD_H)/2 : Math.max(0, Math.min(camY, WORLD_H-viewH));
  return {x:camX,y:camY};
}

/* ================= Banner ================= */
let bannerTimeout = null;
function showBanner(text, dur){
  bannerEl.textContent = text;
  bannerEl.hidden = false;
  clearTimeout(bannerTimeout);
  bannerTimeout = setTimeout(()=>{ bannerEl.hidden = true; }, dur||2200);
}

/* ================= Tile drawing ================= */
function drawTile(t,x,y,col,row){
  if(t==='B'){
    ctx.fillStyle = '#274b1e'; ctx.fillRect(x,y,TILE,TILE);
    ctx.fillStyle = PAL.dragonWing;
    ctx.beginPath(); ctx.arc(x+TILE/2,y+TILE/2,TILE/2-4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#245a1e';
    ctx.beginPath(); ctx.arc(x+TILE/2-7,y+TILE/2-6,7,0,Math.PI*2); ctx.fill();
    return;
  }
  const shade = (col+row)%3===0 ? '#7ec850' : '#74bd48';
  ctx.fillStyle = shade;
  ctx.fillRect(x,y,TILE,TILE);
  if((col+row)%5===0){
    ctx.fillStyle = '#69ad3f';
    ctx.fillRect(x+6,y+26,4,8); ctx.fillRect(x+26,y+12,4,8);
  }
  if(t==='W'){
    ctx.fillStyle = '#4f9bdc';
    ctx.fillRect(x,y,TILE,TILE);
    ctx.fillStyle = '#2f6fb0';
    ctx.fillRect(x,y+TILE-8,TILE,8);
    const wobble = Math.sin(performance.now()/300 + col + row)*2.5;
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath();
    ctx.moveTo(x+2,y+13+wobble); ctx.lineTo(x+TILE-2,y+13+wobble);
    ctx.stroke();
  } else if(t==='H'){
    ctx.fillStyle = '#4a3018';
    ctx.beginPath(); ctx.ellipse(x+TILE/2,y+TILE/2,TILE/2-3,TILE/2-6,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#241608';
    ctx.beginPath(); ctx.ellipse(x+TILE/2,y+TILE/2,TILE/2-10,TILE/2-12,0,0,Math.PI*2); ctx.fill();
  } else if(t==='P'){
    ctx.fillStyle = '#8a5a1e';
    ctx.fillRect(x+7,y+16,TILE-14,TILE-22);
    ctx.fillStyle = PAL.gold;
    ctx.fillRect(x+7,y+20,TILE-14,4);
    ctx.fillStyle = '#5a3a10';
    ctx.fillRect(x+5,y+13,TILE-10,6);
    ctx.fillStyle = '#f6d33c';
    ctx.fillRect(x+TILE/2-3,y+18,6,6);
  }
}

function renderAll(){
  const cam = getCamera();
  ctx.clearRect(0,0,viewW,viewH);
  const colStart = Math.max(0, Math.floor(cam.x/TILE)-1);
  const colEnd = Math.min(COLS-1, Math.ceil((cam.x+viewW)/TILE)+1);
  const rowStart = Math.max(0, Math.floor(cam.y/TILE)-1);
  const rowEnd = Math.min(ROWS-1, Math.ceil((cam.y+viewH)/TILE)+1);
  for(let r=rowStart;r<=rowEnd;r++){
    for(let c=colStart;c<=colEnd;c++){
      drawTile(tileAt(c,r), c*TILE-cam.x, r*TILE-cam.y, c, r);
    }
  }
  if(dragon.active){
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(dragon.x-cam.x+16, dragon.y-cam.y+22, 14, 6, 0, 0, Math.PI*2);
    ctx.fill();
  }

  let px = player.x-cam.x+8, py = player.y-cam.y-2;
  if(player.shakeTimer>0){ px += Math.sin(performance.now()/20)*2; }
  if(player.side==='bride') drawBride(ctx, px, py, player.frame, player.flip);
  else drawGroom(ctx, px, py, player.frame, player.flip);

  if(dragon.active){
    drawDragon(ctx, dragon.x-cam.x-2, dragon.y-cam.y-6, dragon.flap);
  }
}

/* ================= Movement logic ================= */
function attemptMove(dir){
  if(player.moving || STATE!=='game') return;
  let nc=player.col, nr=player.row;
  if(dir==='up') nr--;
  else if(dir==='down') nr++;
  else if(dir==='left'){ nc--; player.flip=true; }
  else if(dir==='right'){ nc++; player.flip=false; }
  const t = tileAt(nc,nr);
  if(t==='B' || t==='W' || t==='P'){
    player.shakeTimer = 180;
    sfxBlocked();
    return;
  }
  player.col = nc; player.row = nr;
  player.pendingTile = t;
  player.fromX = player.x; player.fromY = player.y;
  player.toX = nc*TILE; player.toY = nr*TILE;
  player.moving = true; player.moveStart = performance.now();
  player.frame = 1 - player.frame;
  sfxStep();
}
function onMoveComplete(){
  player.moving = false;
  if(player.pendingTile === 'H') doSink();
  else updateSmashVisibility();
}
function snapPlayerToStart(){
  player.col = startPos.col; player.row = startPos.row;
  player.x = player.fromX = player.toX = startPos.col*TILE;
  player.y = player.fromY = player.toY = startPos.row*TILE;
}
function doSink(){
  STATE = 'opening';
  sfxSink();
  showBanner("Oh no, a hole! Back to the start~", 2200);
  setTimeout(()=>{
    snapPlayerToStart();
    player.invuln = 700;
    STATE = 'game';
    updateSmashVisibility();
  }, 650);
}
function doCaught(){
  STATE = 'opening';
  sfxCaught();
  showBanner("The dragon caught you!! Back to the start!", 2400);
  setTimeout(()=>{
    snapPlayerToStart();
    player.invuln = 1000;
    initDragon();
    STATE = 'game';
    updateSmashVisibility();
  }, 500);
}
function updateSmashVisibility(){
  const d = Math.max(Math.abs(player.col-prizePos.col), Math.abs(player.row-prizePos.row));
  smashVisible = (d<=1 && STATE==='game');
  smashBtn.hidden = !smashVisible;
}
function triggerSmash(){
  if(STATE!=='game' || !smashVisible) return;
  STATE = 'opening';
  smashBtn.hidden = true;
  sfxUnlock();
  showBanner("The chest bursts open!! ✨", 1600);
  setTimeout(()=>{
    STATE = 'invite';
    gameCanvas.hidden = true;
    bannerEl.hidden = true;
    compassEl.hidden = true;
    dpadEl.hidden = true; abBtnsEl.hidden = true; startSelectEl.hidden = true;
    inviteScreen.hidden = false;
  }, 950);
}

/* ================= Main loop ================= */
function tick(now){
  const dt = now - lastTs; lastTs = now;

  if(STATE==='game'){
    if(!player.moving && inputDir) attemptMove(inputDir);
    if(player.moving){
      const t = Math.min(1, (now-player.moveStart)/MOVE_DUR);
      player.x = player.fromX + (player.toX-player.fromX)*t;
      player.y = player.fromY + (player.toY-player.fromY)*t;
      if(t>=1){ player.x=player.toX; player.y=player.toY; onMoveComplete(); }
    }
    if(player.shakeTimer>0) player.shakeTimer -= dt;
    if(player.invuln>0) player.invuln -= dt;

    if(!dragon.active){
      dragon.spawnTimer += dt;
      if(dragon.spawnTimer >= dragon.spawnDelay){
        spawnDragonAround(player.x, player.y, DETECT_RADIUS*1.1, DETECT_RADIUS*1.7);
        dragon.active = true;
        showBanner("Something is coming...", 1800);
      }
    }

    if(dragon.active){
    const distToPlayer = Math.hypot(player.x-dragon.x, player.y-dragon.y);
    const wasChasing = dragon.chasing;
    dragon.chasing = distToPlayer < DETECT_RADIUS;
    if(dragon.chasing && !wasChasing) sfxRoar();

    dragon.stepTimer += dt;
    const stepInterval = dragon.chasing ? CHASE_STEP_MS : PATROL_STEP_MS;
    if(dragon.stepTimer >= stepInterval){
      dragon.stepTimer = 0;
      dragon.fromX = dragon.x; dragon.fromY = dragon.y;
      if(dragon.chasing){
        const dx = player.x-dragon.x, dy = player.y-dragon.y;
        const angle = Math.atan2(dy,dx) + (Math.random()-0.5)*0.35;
        dragon.toX = dragon.x + Math.cos(angle)*TILE;
        dragon.toY = dragon.y + Math.sin(angle)*TILE;
      } else {
        const angle = Math.random()*Math.PI*2;
        dragon.toX = dragon.x + Math.cos(angle)*TILE*0.7;
        dragon.toY = dragon.y + Math.sin(angle)*TILE*0.7;
      }
      dragon.toX = Math.max(TILE, Math.min(WORLD_W-TILE*2, dragon.toX));
      dragon.toY = Math.max(TILE, Math.min(WORLD_H-TILE*2, dragon.toY));
      dragon.flap = 1 - dragon.flap;
    }
    const dt2 = Math.min(1, dragon.stepTimer/stepInterval);
    dragon.x = dragon.fromX + (dragon.toX-dragon.fromX)*dt2;
    dragon.y = dragon.fromY + (dragon.toY-dragon.fromY)*dt2;

    const distToPrize = Math.hypot((player.x+20)-(prizePos.col*TILE+20), (player.y+20)-(prizePos.row*TILE+20));
    const nearChestSafe = distToPrize < TILE*2.4;
    if(player.invuln<=0 && !nearChestSafe){
      if(Math.abs(player.x-dragon.x)<22 && Math.abs(player.y-dragon.y)<22){
        doCaught();
      }
    }
    } /* end dragon.active */

    const ang = Math.atan2((prizePos.row*TILE+20)-(player.y+20), (prizePos.col*TILE+20)-(player.x+20)) * 180/Math.PI;
    compassArrow.style.transform = 'rotate('+ang+'deg)';
  }

  if(STATE==='game' || STATE==='opening'){
    renderAll();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ================= Map preview (select screen) ================= */
function drawMapPreview(){
  const cv = document.getElementById('mapPreview');
  const pc = cv.getContext('2d');
  const cellW = cv.width/COLS, cellH = cv.height/ROWS;
  pc.clearRect(0,0,cv.width,cv.height);
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const t = tileAt(c,r);
      let color = '#7ec850';
      if(t==='B') color = '#2f7a3a';
      else if(t==='W') color = '#4f9bdc';
      else if(t==='H') color = '#241608';
      pc.fillStyle = color;
      pc.fillRect(c*cellW, r*cellH, Math.ceil(cellW), Math.ceil(cellH));
    }
  }
  pc.fillStyle = PAL.gold;
  pc.beginPath();
  pc.arc(prizePos.col*cellW+cellW/2, prizePos.row*cellH+cellH/2, Math.max(3,cellW*0.9), 0, Math.PI*2);
  pc.fill();
}

/* ================= Storage helpers ================= */
function getList(key){
  try{ return JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){ return []; }
}
function pushList(key,item){
  const list = getList(key);
  list.unshift(item);
  localStorage.setItem(key, JSON.stringify(list.slice(0,200)));
}
function postIfConfigured(endpoint,payload){
  if(!endpoint) return;
  fetch(endpoint, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  }).catch(()=>{});
}

/* ================= Wishes form ================= */
function renderWishes(){
  const list = getList('wedding_wishes');
  const el = document.getElementById('wishList');
  if(list.length===0){
    el.innerHTML = '<p style="color:#9a8a6a;">No wishes yet — be the first!</p>';
    return;
  }
  el.innerHTML = list.map(w=>{
    const d = new Date(w.ts);
    const when = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    return '<div class="wishCard"><b>'+escapeHtml(w.name)+'</b><div>'+escapeHtml(w.message)+'</div><div class="when">'+when+'</div></div>';
  }).join('');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
document.getElementById('wishForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const name = document.getElementById('wishName').value.trim();
  const message = document.getElementById('wishMsg').value.trim();
  if(!name || !message) return;
  const entry = { name, message, ts: Date.now() };
  pushList('wedding_wishes', entry);
  postIfConfigured(CONFIG.wishEndpoint, entry);
